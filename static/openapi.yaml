  /v1/onboarding/embedded-signup:
    post:
      tags:
        - WhatsApp 客户接入
      summary: 完成接入，返回 201 和可追踪的操作记录。
      description: 所需 scope：`onboarding:write`
      x-notes: |-
        #### 编排的五个阶段
        - 用 `code` 向 Meta 换取该 Portfolio 的客户 System User token，加密（AES-256-GCM）保存。
        - 校验该 token 确实拥有目标 WABA/号码的资产授权。
        - 向 Meta 订阅应用（subscribeApp）。
        - 若本次请求带了号码注册意图，调用注册（PIN 懒生成并加密保存）。
        - 把最终的 WABA/号码详情同步落库。

        #### 失败了怎么办
        进度落库、可恢复：任一步失败即中断，`currentStep`/`lastError*` 停在失败处，此后必须调用 retry 接口**从断点续跑**——重新 POST 本接口会新建一个全新的 operation，而不是继续旧的。

        portfolioId 必须已存在于当前租户下，不存在直接 404，不会隐式创建。
      x-nav-label: 完成接入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                portfolioId:
                  type: string
                  description: string · 必填 — 平台内 Business Portfolio ID，bm_...
                code:
                  type: string
                  description: string · 必填 — Meta OAuth 一次性授权码
                wabaId:
                  type: string
                  description: string · 必填 — Meta 返回的 WABA ID
                phoneNumberId:
                  type: string
                  description: string · 可选 — Meta 返回的 Phone Number ID。**可以没有**：ES v3 起客户可以不带号码收尾，号码之后再补
                esVersion:
                  type: string
                  description: v2 | v3 | v4 · 可选 — 本次流程用的 ES 版本，仅用于排查（灰度期两套并存）
                  enum:
                    - v2
                    - v3
                    - v4
                sessionInfo:
                  type: object
                  description: object · 可选 — ES message 事件回传的会话信息原文，含客户选中的资产 id（`dataset_ids` 即 Pixel/dataset）
                  additionalProperties: true
              required:
                - portfolioId
                - code
                - wabaId
              example:
                portfolioId: bm_x
                code: <META_OAUTH_CODE>
                wabaId: <META_WABA_ID>
                phoneNumberId: <META_PHONE_NUMBER_ID>
            example:
              portfolioId: bm_x
              code: <META_OAUTH_CODE>
              wabaId: <META_WABA_ID>
              phoneNumberId: <META_PHONE_NUMBER_ID>
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_v1_onboarding_embedded_signup
