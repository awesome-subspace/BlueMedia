  /v1/wabas/{id}/analytics:
    get:
      tags:
        - 资产与号码配置
      summary: "直接查询该 WABA 在 Meta 侧的用量/费用分析，作为本地账本用量视图的交叉核对。messaging 与 pricing 两个字段各自独立请求、独立汇报成败：响应为 { messaging: {ok, data|error}, pricing: {ok, data|error} }，任一字段被 Meta 拒绝时另一字段仍返回数据，错误里带 Meta 原始 code/subcode。注意 pricing 的 COST 对共享 Solution Partner 信用额度的 WABA 不会返回。"
      description: 所需 scope：`billing:read`
      x-notes: |-
        #### 参数校验

        - `start`/`end`：必须能解析成有限数字的 unix 时间戳，解析失败直接 400。
        - `granularity`：只严格接受 `HALF_HOUR`/`MONTH` 两个非默认取值，传其它任何值（包括缺省）都**静默落回 `DAY`**——接口不会帮你纠正拼写提醒，调用方需自行确认。
