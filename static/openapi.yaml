paths:
  /whoami:
    get:
      tags:
        - 接入准备与鉴权
      summary: 验证 API Key，并返回当前账户标识与 API 服务版本。
      x-notes: 这是无副作用的凭证校验接口。`tenantId` 用于确认当前 API Key 对应的账户，`platformVersion` 仅表示当前 API 进程版本。响应可能包含额外诊断字段；客户集成不应依赖这些字段判断权限。
      x-summary-en: Validate the API key and return its account identifier and the version of the API process serving the request.
      x-notes-en: This is a side-effect-free credential check. The documented fields are stable for customer integrations; additional diagnostic fields may be present and should not be used for authorization decisions.
      x-nav-label: 验证 API Key
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - tenantId
                  - platformVersion
                properties:
                  tenantId:
                    type: string
                    description: 当前 API Key 对应的账户标识
                  platformVersion:
                    type: string
                    description: Version of the API process serving this request
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: get_whoami
  /oauth/token:
    post:
      tags:
        - 接入准备与鉴权
      summary: OAuth token 端点：支持 authorization_code 与 refresh_token。
      x-notes: |-
        #### 响应

        `access_token`、`refresh_token`、`token_type: Bearer`、`expires_in`（秒）、`scope`、`account_id`、`project_id`、`connection_id`。

        #### 有效期与轮换

        access token **1 小时**，refresh token **30 天**。每次 refresh 都**轮换**：旧的一对立即撤销，签发全新一对。这不是为了省事——refresh token 泄露后，轮换让泄露者与真客户端只有一个能继续用，另一个的下次 refresh 失败即是异常信号；而「续期同一行」会让泄露副本永久可用且没有任何迹象。

        #### 失败语义

        authorization code 的「不存在 / 已用过 / 已过期」返回**同一句文案**，刻意不区分——区分开来这个端点就成了 code 状态的探测器。code 的消费用一条条件 UPDATE 完成（`WHERE used_at IS NULL AND expires_at > now()`，数据库时钟判定），而不是先查再写：两个并发请求会同时通过查询各换到一份 token，而授权码重放正是 OAuth 最经典的攻击。

        #### 用 access token 调业务接口

        `Authorization: Bearer oat_...`，与 API Key 使用相同的请求头。Access token 的可访问范围固定为授权时选择的 Business Portfolio，不能通过请求参数扩大，也不能访问其它客户资产。
      x-nav-label: OAuth token 端点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: string · 必填 — `authorization_code` 或 `refresh_token`
                client_id:
                  type: string
                  description: "string · 必填 — "
                client_secret:
                  type: string
                  description: string · 必填 — 客户端认证方式就是它——所以本端点**不挂 API Key 鉴权**
                code:
                  type: string
                  description: string · 可选 — grant_type=authorization_code 时必填
                redirect_uri:
                  type: string
                  description: string · 可选 — grant_type=authorization_code 时必填，且必须与签发时**逐字一致**（RFC 6749 §4.1.3）
                code_verifier:
                  type: string
                  description: string · 可选 — 授权时带了 code_challenge 就**必须**带它，否则 400——允许省略等于让截获 code 的人一句不传就绕过整个 PKCE
                refresh_token:
                  type: string
                  description: string · 可选 — grant_type=refresh_token 时必填
              required:
                - grant_type
                - client_id
                - client_secret
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_oauth_token
  /v1/conversions/events:
    post:
      tags:
        - 消息发送与状态
      summary: 上报一条转化事件（Conversions API for business messaging）。返回 202 表示已排队，**不代表已发给 Meta**。
      description: 所需 scope：`messages:send`
      x-notes: |-
        #### 为什么是 202，不是「已上报」

        事件先落库、由调度器异步发给 Meta。两个原因：一是另一条来源（`automatic_events` webhook）是在 webhook 中继的**事务里**捕获的，在事务里做 Graph 往返会持住整批事件的行锁，而事务回滚后我们已经报过一个从未落库的转化；二是上报会失败（客户还没绑 Pixel、token 过期、Meta 5xx），而事件不可重造。用 `GET /v1/conversions/events` 看每条的 `status`。

        #### datasetBound=false 意味着什么

        当前 Business Portfolio 还没有 Pixel（dataset）——事件已经**保存**，但状态是 `skipped`，不会发出。Pixel 是客户在嵌入式注册（ES v4，登录配置里勾选 Conversions API）时选择的，Graph API 上查不到这个绑定关系。补绑之后这些事件可以重放。

        #### 金额单位

        请求里的 `value` 是**主单位**（250 = 250 元/美元），与 Meta 的 `custom_data.value` 一致；平台内部按 minor units 存（与账本同一表示法，避免浮点误差），只在发给 Meta 的出口换算一次。

        #### 没有 ctwaClid 的对话无法上报

        `ctwa_clid` 只在用户**点击 Click-to-WhatsApp 广告**进来的那条消息里出现（WhatsApp Status 广告位不带它）。普通对话没有可归因的点击，Meta 不接受。
      x-nav-label: 上报一条转化事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                portfolioId:
                  type: string
                  description: string · 必填 — 事件所属的 Business Portfolio，bm_...（Pixel 绑在它上面）
                ctwaClid:
                  type: string
                  description: string · 必填 — 广告点击 id。取自 `GET /v1/conversations/{id}` 的 `ctwaClid`
                eventName:
                  type: string
                  description: string · 必填 — Meta 标准事件名：Purchase / LeadSubmitted / AddToCart / InitiateCheckout
                value:
                  type: number
