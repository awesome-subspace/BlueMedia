                code: <META_OAUTH_CODE>
                wabaId: <META_WABA_ID>
                phoneNumberId: <META_PHONE_NUMBER_ID>
            example:
              code: <META_OAUTH_CODE>
              wabaId: <META_WABA_ID>
              phoneNumberId: <META_PHONE_NUMBER_ID>
      security: []
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_v1_onboarding_invitations_token_complete
  /v1/onboarding/invitations/{token}/retry:
    post:
      tags:
        - WhatsApp 客户接入
      summary: 【客户侧，无需鉴权】首次授权失败后，用新的 Meta code 继续**同一条** operation（不会新建接入任务）。只接受 code：wabaId/phoneNumberId 已记在 operation 上，重试时不允许更换目标资产。仅 failed 且链接未过期的邀请可重试；已完成的返回 409。
      x-notes: |-
        #### 抢占失败时的诊断
        抢占条件比 complete 更严格：要求邀请状态恰好是 `failed`、链接未过期、且已经绑定过 operationId。抢不到时不会笼统报错，而是先诊断具体原因再给出对应提示：
        - `completed` → "无需重试"
        - `pending`（从未成功提交过）→ "尚未提交过，请先完成授权"
        - `running`（正在处理中）→ "正在处理中，请稍候"，并标注 `retryable:true` 供落地页轮询
        - `failed` 但链接已过期 → 等价于"邀请已失效"

        #### 续跑语义
        底层复用 retryEmbeddedSignup **从上次失败的那一步续跑**，已经成功执行过的订阅/号码注册步骤不会重复执行。如果这次重试又抛错，邀请会被放回 `failed`（而不是像 complete 失败时那样放回 pending）——刻意保持"已经提交过一次"的语义，保证下一次仍然走本接口而不是误落回首次提交的 complete。
      x-nav-label: 首次授权失败后
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: string · 必填 — 新的 Meta OAuth 一次性授权码
              required:
                - code
              example:
                code: <FRESH_META_OAUTH_CODE>
            example:
              code: <FRESH_META_OAUTH_CODE>
      security: []
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_v1_onboarding_invitations_token_retry
