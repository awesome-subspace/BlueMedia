  /v1/webhook-endpoints:
    post:
      tags:
        - Webhook 集成
      summary: "创建租户回调端点。回调携带 X-Webhook-Signature-256: sha256=...；使用端点 secret 对原始请求体做 HMAC-SHA256，secret 只返回一次。"
      x-notes: 若省略 secret，平台自动生成；生成值只在这一次创建响应里返回，服务端此后只保存密文/哈希，无法再明文取回，遗失只能重新创建端点。events 省略等于订阅 message/status/change/probe 全部四类，不是"不订阅"。
      x-summary-en: Register an HTTPS endpoint to receive inbound messages, delivery status updates and platform events.
      x-notes-en: |-
        Every delivery is signed. Verify `X-Webhook-Signature-256: sha256=<hex>` — HMAC-SHA256 of the **raw** request body with your endpoint secret — **before parsing the body**, and compare in constant time. The secret is returned once, at creation.

        Respond 2xx within a few seconds. Non-2xx responses and timeouts are retried with exponential backoff, so deliveries are at-least-once: make your handler idempotent on the event id. GET /v1/webhook-endpoints reports the most recent delivery attempt per endpoint, which is the fastest way to find out why nothing is arriving.
      x-nav-label: 创建租户回调端点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: URL · 必填 — 接收回调的 HTTPS 地址
                  format: uri
                events:
                  type: string
                  description: message | status | change | probe | * · 可选 — 订阅事件
                  enum:
                    - message
                    - status
                    - change
                    - probe
                    - "*"
                secret:
                  type: string
                  description: string · 可选 — 至少 16 字符；省略时平台生成
              required:
                - url
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_v1_webhook_endpoints
    get:
      tags:
        - Webhook 集成
      summary: 列出端点；不返回 secret。每个端点带 `lastDelivery`（该端点最近一次投递的 status / responseStatus / attempts / lastError / createdAt），从未投递过为 `null`。刻意不提供 delivered/failed 计数：那是随消息量线性变慢的 COUNT 聚合。
      x-notes: 每个端点的 lastDelivery 由一条 LEFT JOIN LATERAL 查询取得，而不是逐端点查询或 DISTINCT ON，依赖迁移新增的 (endpoint_id, created_at DESC) 索引才能保持常数级开销。
      x-nav-label: 列出端点
      responses:
