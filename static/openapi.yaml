  /v1/credit-account/allocations:
    get:
      tags:
        - 账务与服务状态
      summary: Business Portfolio 预算总览：账户余额及各 Portfolio 的上限、已用与剩余。
      description: 所需 scope：`billing:read`
      x-notes: |-
        #### 账户额度与 Portfolio 预算

        钱只有一个池子——当前账户的信用余额。Business Portfolio 预算是这个余额之上的**支出上限**，不是第二个钱包；调整预算不会改变账户余额，也不存在“把钱转回来”的动作。

        #### allocatedMinor = null 表示不限额

        没有设置过预算的 Portfolio 返回 `allocatedMinor: null`（以及 `remainingMinor: null`），意思是**只受账户余额约束**，不是“额度为 0”。要冻结一个 Portfolio 请显式设为 0。列表中也会包含尚未设置预算的 Portfolio。

        #### 允许超分配

        各 Portfolio 预算上限之和可以超过账户余额，此时 `overAllocated: true`。这是提示而不是错误，真实消费仍按账户剩余余额先到先得。

        `reservedMinor` 是已发出、尚未结算的冻结部分；剩余额度 = `allocatedMinor − spentMinor − reservedMinor`。
      x-nav-label: Business Portfolio 预算总览
      responses:
        "200":
          description: OK
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: get_v1_credit_account_allocations
  /v1/credit-account/allocations/{portfolioId}:
    put:
      tags:
        - 账务与服务状态
      summary: 设置某个 Business Portfolio 的预算上限。
      description: 所需 scope：`billing:read`
      x-notes: |-
        幂等：同样的入参重复调用结果一致（这是一个「设为」而不是「增加」的接口）。

        #### 只能调整当前授权范围内的 Portfolio

        `portfolioId` 必须位于当前 API Key 的授权范围内，否则返回 404。请求体不接受 `tenantId` 或币种字段；账户尚未开通额度时返回 409。

        #### 设成低于已用是允许的

        上限可以低于 `spentMinor + reservedMinor`，此时剩余为 0，该 Portfolio 会立即停止发送新消息——这正是“马上停掉它”的用法。要恢复“不限额”请使用 DELETE，不要设置一个很大的数。

        额度用完后发送会以 `402 BM_BUDGET_EXCEEDED` 失败（单条消息则记为该失败码），群发在创建时就会按总成本试算拒绝，不会发一半停下。
      x-nav-label: 设置某个 Business Portfolio 的预算上限
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allocatedMinor:
                  type: integer
                  description: integer >= 0 · 必填 — 该 Business Portfolio 的预算上限，最小货币单位。0 = 冻结
                  minimum: 0
                note:
                  type: string
                  description: string(200) · 可选 — 备注（给人看的，例如「双十一活动预算」）
                  maxLength: 200
              required:
                - allocatedMinor
      responses:
        "200":
          description: OK
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: put_v1_credit_account_allocations_portfolioId
    delete:
      tags:
        - 账务与服务状态
      summary: 取消某个 Business Portfolio 的预算上限，之后只受账户余额约束。
      description: 所需 scope：`billing:read`
      x-notes: |-
        和“设为 0”是**相反**的意思：0 是冻结这个 Portfolio，删除是不再对它单独设限。没有分配记录时返回 404。

        已经发生的消费流水不会被删——账本是只增的，`spentMinor` 只是不再有上限与之比较。
      x-nav-label: 取消某个 Business Portfolio 的预算上限
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "204":
          description: No Content
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: delete_v1_credit_account_allocations_portfolioId
  /v1/credit-account/allocations/audit:
    get:
      tags:
        - 账务与服务状态
      summary: Business Portfolio 预算对账：spent 计数与账本汇总的差额。
      description: 所需 scope：`billing:read`
      x-notes: |-
        `spentMinor` 是发送路径在 reserve / settle / reverse 三处维护的**增量计数**，账本（`ledger_entries`）是权威口径。若某次更新遗漏，Business Portfolio 的预算统计会产生长期偏差，因此本接口并列返回两个口径：`driftMinor = counterSpentMinor − ledgerSpentMinor`，正常应为 0。

        **只读，不自动修**：自动对齐会把「哪条代码路径漏了更新」这个真正的问题一起抹掉。发现非 0 请提工单。
