  /v1/webhook-endpoints/{id}/enable:
    post:
      tags:
        - Webhook 集成
      summary: 重新启用被停用（DELETE）的端点。
      x-notes: |-
        #### 为什么需要它
        `DELETE {id}` 是**软停用**，而 `PATCH {id}` 只接受 url / events / metadata —— 在本接口存在之前，停用是一道**单向门**：投递永久停止，唯一出路是删掉重建，代价是换掉 endpoint id、丢失历史投递记录、集成方那边还要改配置。而 `rotate-secret` 的文档本身就建议「先停用再轮换」，照着做的人会把自己的端点变成砖。

        #### 恢复到哪个状态由平台决定，不接受调用方指定
        已经验证过的端点（`verifiedAt` 非空）恢复为 `active` —— 它证明过自己控制那个地址，停用不会让这件事失效。**没验证过、且走连接协议的端点恢复为 `pending`**，必须重新过一次所有权验证：否则「创建一个指向别人服务器的端点 → 停用 → 启用」就是一条三次调用绕过验证的路，把一个防滥用机制变成装饰。沿用旧路径直建的端点（先于验证流程存在、创建即 active）恢复为 `active`，因为它没有可走的验证流程，给它 `pending` 等于让它永远发不出去。

        对已经是 active / pending 的端点调用是**幂等**的：回到它本该在的状态，并清掉 `disabledAt`。不返回 secret。
      x-nav-label: 重新启用被停用的端点
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_v1_webhook_endpoints_id_enable
  /v1/webhook-endpoints/{id}/verify:
    post:
      tags:
        - Webhook 集成
      summary: 触发所有权验证（两阶段协议的第二阶段）。
      x-notes: |-
        #### 为什么要分两阶段
        创建响应里才返回 secret，而调用方要拿到响应之后才能把它存起来。如果平台在创建时就立刻发验证挑战，接收端手上还没有 secret 可用于验签，挑战必然失败、端点永远卡在 `pending`。所以顺序固定为：创建（拿到 secret）→ 自己保存好 → 调本接口。

        #### 挑战的形状
        平台**同步**向该端点 POST 一条 `webhook.verification` 事件，`data.challenge` 是一次性随机值，并**按正常投递规则签名** —— 这正是验证的意义：能验通这一条，就能验通后续所有真实事件。接收方需返回 2xx，且响应 JSON 里回显同一个 `challenge`（顶层或 `data.challenge` 都接受）。

        #### 结果
        成功 → 状态转 `active`，开始投递。失败 → **保持 `pending`**（不会变成 disabled），原因记在 `metadata.last_verification_error`，修好接收端后可以再调一次。挑战超时 5s，响应体只读前 4 KB。
      x-nav-label: 触发所有权验证
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_v1_webhook_endpoints_id_verify
