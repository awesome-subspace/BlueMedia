  /v1/messages:
    post:
      tags:
        - 消息发送与状态
      summary: 提交出站消息，返回 202 与 accepted 状态。建议携带业务唯一的 Idempotency-Key（最长 200 字符）；同租户重复 key 返回同一消息；默认限流 600 条/分钟。
      description: 所需 scope：`messages:send`
      x-notes: |-
        #### 模板消息的参数绑定

        `components` 里的 `parameters` 必须与创建模板时声明的占位符数量和顺序**完全一致**，否则 Meta 返回参数不匹配错误。模板类型不受 24 小时客服窗口限制，可随时发送。

        #### 24 小时窗口的本地预检

        窗口外发自由格式消息（非 template）会在**落库前**本地判定并直接返回 `409 WHATSAPP_24H_WINDOW_EXPIRED`，不会走到 Meta 那一层浪费一次信用预留。但本地判定只挡"确定关闭"的情况：本地认为窗口开着、实际已关闭的消息，仍可能被 Meta 拒绝，那种情况走消息失败码的正常回落流程（见「错误码」页的消息失败码表）。

        #### 媒体消息的限制

        按类型有独立的大小与格式限制（图片约 5MB、音视频约 16MB、文档约 100MB），超限由 **Meta 在投递阶段**拒绝，平台不做预检——超限消息会先拿到 202 accepted，之后才通过状态回调失败。

        #### 收件人可以是手机号，也可以是 BSUID

        `to`（手机号）与 `toUserId`（BSUID）**至少给一个**，都给时**以手机号为准**（与 Meta 的优先级一致）。

        BSUID 是 Meta 从 2026 年 4 月起在每条入站消息里下发的用户标识（形如 `US.13491208655302741918`，按业务组合唯一），可以从 `GET /v1/conversations` 的 `contactUserId` 取到。**它是某些会话唯一可用的收件人标识** —— 用户启用 WhatsApp 用户名后，除非你与他 30 天内互动过，Meta 不会再下发手机号。

        两条限制：

        - **one-tap / zero-tap / copy-code 认证模板不能发给 BSUID**（Meta 要求这几种必须用手机号）。平台在发送前本地拒掉并说明原因，而不是让你拿到一个含糊的 `131062` —— 这类模板通常是登录验证码，失败意味着用户登不进去。
        - BSUID **按 Business Portfolio 唯一**：拿 A 客户的 BSUID 用 B 客户的号码发送会失败。
      x-summary-en: Queue an outbound message. Returns 202 with status `accepted` — delivery is asynchronous; poll GET /v1/messages/{id} or subscribe to webhooks for the outcome.
      x-notes-en: |-
        Send an `Idempotency-Key` header (max 200 chars) keyed on your own business id: a repeated key within the current account returns the original message instead of sending twice. The default rate limit is 600 messages/minute for the current account.

        Free-form types (text, image, document, …) require an open 24-hour customer service window — it opens when the customer messages you, and once it closes the request is refused locally with `409 WHATSAPP_24H_WINDOW_EXPIRED` before anything is persisted or charged. Outside the window only approved templates can be sent. The local check only blocks the definitely-closed case; a window we believe is open can still be rejected by Meta.

        Recipient: pass `to` (E.164 phone, no `+`) or `toUserId` (business-scoped user id, e.g. `US.13491208655302741918`). At least one is required; if both are given the phone wins, matching Meta. One-tap / zero-tap / copy-code authentication templates cannot be delivered to a BSUID and are refused locally, because Meta returns an unactionable error and these are usually login codes.

        Credit is reserved before the send and settled when Meta accepts. Meta bills per delivery, so a message Meta accepts but later fails to deliver is credited back automatically.
      x-nav-label: 提交出站消息
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 业务唯一键，最长 200 字符；同租户重复 key 返回同一消息，不会重复发送
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
            examples:
              text:
                value:
                  phoneNumberId: pn_01923abc
                  to: "8613800138000"
                  type: text
                  text:
                    body: 你好
                    preview_url: false
              image:
                value:
                  phoneNumberId: pn_01923abc
                  toUserId: US.13491208655302741918
                  type: image
                  image:
                    link: https://cdn.example.com/image.jpg
                    caption: 图片说明
      responses:
        "202":
          description: 请求已进入异步发送流程；不代表已送达。幂等重放可能返回原消息的当前状态。
          headers:
            X-Request-Id:
              description: 请求追踪 ID；错误响应始终返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRecord"
        "400":
          description: 请求体、Idempotency-Key 或收件人格式无效。
          headers:
            X-Request-Id:
              description: 请求追踪 ID；错误响应始终返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API Key 缺失或无效。
          headers:
            X-Request-Id:
              description: 请求追踪 ID；错误响应始终返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: scope 不足，或收件人已退订营销消息。
          headers:
            X-Request-Id:
              description: 请求追踪 ID；错误响应始终返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 发送号码不存在或不属于当前授权范围。
          headers:
            X-Request-Id:
              description: 请求追踪 ID；错误响应始终返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 幂等键冲突，或 24 小时客服窗口已关闭。
          headers:
            X-Request-Id:
              description: 请求追踪 ID；错误响应始终返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 超过调用频率，或命中 Meta 人均互动冷却。请根据 error.retryable 决定是否退避重试。
          headers:
            X-Request-Id:
