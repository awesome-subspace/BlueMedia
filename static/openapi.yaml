              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 平台内部错误。记录 X-Request-Id 后重试或联系支持。
          headers:
            X-Request-Id:
              description: 请求追踪 ID；错误响应始终返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
