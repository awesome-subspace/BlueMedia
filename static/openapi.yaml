        - status
        - wamid
        - errorCode
        - errorMessage
        - metaError
        - idempotencyKey
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: ^msg_
        tenantId:
          type: string
        phoneNumberId: &a4
          type:
            - string
            - "null"
        metaPhoneNumberId:
          type: string
        toNumber: *a4
        toUserId: *a4
        type:
          type: string
        content: {}
        category: *a4
        status:
          type: string
          enum: *a5
        wamid: *a4
        errorCode: *a4
        errorMessage: *a4
        metaError:
          type:
            - object
            - "null"
          additionalProperties: true
        idempotencyKey: *a4
        createdAt: &a6
          type: string
          format: date-time
        updatedAt: *a6
    MessageFailure:
      type: object
      additionalProperties: false
      required:
        - code
        - metaCode
        - message
        - meta
        - retryable
        - customerAction
      properties:
        code:
          type: string
        metaCode:
          type:
            - integer
            - "null"
        message:
          type: string
        meta:
          type:
            - object
            - "null"
          additionalProperties: true
        retryable:
          type: boolean
        customerAction:
          type: string
    MessageDetails:
      allOf:
        - $ref: "#/components/schemas/MessageRecord"
        - type: object
          required:
            - stage
            - error
          properties:
            stage:
              type:
                - string
                - "null"
              enum:
                - submit
                - delivery
                - null
            error:
              oneOf:
                - $ref: "#/components/schemas/MessageFailure"
                - type: "null"
    WebhookMessageEvent:
      type: object
      required:
        - kind
        - message
      properties:
        kind:
          const: message
        wabaId:
          type: string
        phoneNumberId:
          type: string
        field:
          type: string
        profileName:
          type: string
        profileUsername:
          type: string
        message:
          type: object
          required:
            - id
          properties:
            id:
              type: string
            type:
              type: string
            from:
              type: string
            from_user_id:
              type: string
            timestamp:
              type: string
          additionalProperties: true
      additionalProperties: false
    WebhookStatusEvent:
      type: object
      required:
        - kind
        - status
      properties:
        kind:
          const: status
        wabaId:
          type: string
        phoneNumberId:
          type: string
        field:
          type: string
        status:
          type: object
          required:
            - id
            - status
          properties:
            id:
              type: string
            status:
              type: string
            timestamp:
              type: string
            recipient_id:
              type: string
          additionalProperties: true
      additionalProperties: false
    WebhookChangeEvent:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          const: change
        wabaId:
          type: string
        phoneNumberId:
          type: string
        field:
          type: string
        value: {}
      additionalProperties: false
    WebhookProbeEvent:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          const: probe
        value: {}
      additionalProperties: false
    PlatformEventEnvelope:
      type: object
      required:
        - id
        - type
        - api_version
        - created_at
        - account_id
        - project_id
        - data
      properties:
        id:
          type: string
          pattern: ^evt_
        type:
          type: string
          enum:
            - job.completed
            - job.failed
            - usage.updated
            - webhook.verification
        api_version:
          type: string
        created_at: *a6
        account_id:
          type: string
        project_id: *a4
        data:
          type: object
          additionalProperties: true
      additionalProperties: false
    WebhookEvent:
      oneOf:
        - $ref: "#/components/schemas/WebhookMessageEvent"
        - $ref: "#/components/schemas/WebhookStatusEvent"
        - $ref: "#/components/schemas/WebhookChangeEvent"
        - $ref: "#/components/schemas/WebhookProbeEvent"
        - $ref: "#/components/schemas/PlatformEventEnvelope"
security:
  - bearerAuth: []
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
webhooks:
  inboundEvent:
    post:
      operationId: receive_webhook_event
      summary: BlueMedia 向已配置端点投递事件
      parameters:
        - name: X-Webhook-Signature-256
          in: header
          required: false
          schema:
            type: string
          description: 默认协议签名。
        - name: Webhook-Signature
          in: header
          required: false
          schema:
            type: string
          description: 连接协议 v1 签名。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: 接收端确认处理。任何 2xx 都视为成功。
