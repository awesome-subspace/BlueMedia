        低价档按分看偏差很大：Brazil utility 真实 $0.0068，`amountMinor` 是 1（$0.01，+47%）；Egypt utility 真实 $0.0036 同样是 1（+178%）。**合计尤其要看 micros**：先按分行取整再求和，误差会逐行累积。
