        #### Meta 授权状态

        服务会自动选择已保存且可用的 Meta 授权信息。若该 Business Portfolio 尚未完成 Meta 授权或授权已经失效，返回 **409 而不是 404**——问题不在于“这个 WABA 不存在”，而在于当前无法代表客户向 Meta 查询数据。
