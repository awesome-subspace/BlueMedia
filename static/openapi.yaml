            schema:
              type: object
              properties:
                pin:
                  type: string
                  description: string · 必填 — 6 位数字
              required:
                - pin
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "202":
          description: Accepted
        4xx:
          description: 客户端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_v1_phone_numbers_id_register
