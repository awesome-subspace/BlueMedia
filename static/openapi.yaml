      summary: 用 6 位 PIN 注册号码。
      description: 所需 scope：`phone_numbers:manage`
      x-notes: |-
        `pin` 是双重语义：既是"首次注册时设置的两步验证 PIN"，也是"号码已开启两步验证时的现有 PIN"，Meta 不区分这两种情况。

