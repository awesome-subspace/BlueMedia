      summary: 读取最终状态、wamid 和失败原因。
      x-notes: |-
        状态流转：`accepted` → `sending` → `submitted` → `sent` → `delivered` → `read`，任一环节都可能转 `failed`。**`submitted` 只代表 Meta 收下了请求并返回 wamid，不等于已发出**；`sent` 是独立的状态回调，`delivered` 才是到达设备。

        失败时，来自 Meta 的 `error.code` 就是 Meta 数字码（可直接对照官方错误码表）；只有账户余额不足、Business Portfolio 预算不足、本地 131049 冷却或重试耗尽等本地判定，才使用我方错误码。`error.message` 是 Meta 原文，不改写；`error.meta` 是整段原生信封（`details` / `userMsg` / `type` / `fbtrace_id`，最后一个是提交 Meta Direct Support 工单时需要的凭据）。`retryable` / `customerAction` / `stage` 是 BlueMedia 的判断而非 Meta 字段（submit 表示尚未投递就被拒，delivery 表示 Meta 已受理后才失败）；同一个失败状态背后可能是性质完全不同的失败，不能只看状态判断是否应该重试。
      x-summary-en: "Read one message: current status, Meta message id (wamid), and — when it failed — a classified failure code plus the action the caller should take."
      x-notes-en: |-
        Status lifecycle: `accepted` -> `sending` -> `submitted` -> `sent` -> `delivered` -> `read`, or `failed` at any point. **`submitted` means Meta accepted the request and returned a wamid — it does not mean the message was sent**; `sent` is a separate status webhook and `delivered` is arrival on the device.

        On failure the response carries `error.code` (**Meta’s own numeric code** when the failure came from Meta; our policy code only for locally-detected failures such as insufficient funds or the local 131049 cooldown), `error.message` (**Meta’s own text, unmodified**), `error.meta` (Meta’s full native error envelope: `details`, `userMsg`, `type`, and `fbtrace_id` — the last being the only identifier a Meta Direct Support ticket can be opened with), `stage` (`submit` = it never reached delivery, `delivery` = Meta accepted it first) and `customerAction`, which says who fixes it: `fix_template_params` is yours to fix in seconds, `contact_platform_admin` is ours. Codes with `retryable: false` will fail identically on retry.
