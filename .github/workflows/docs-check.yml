name: Docs check

on:
  pull_request:
  push:
    branches:
      - v1.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run docs:check
      - run: npm run docs:lint
