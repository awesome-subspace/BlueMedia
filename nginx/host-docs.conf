# BSPDocSystem 宿主机 nginx 实例 —— docs.bsptest.com
#
# ⚠️ 本文件不是容器里那份。本目录下有两个 conf，职责完全不同：
#
#   nginx/docs.conf       容器内的 server 块，被 Dockerfile COPY 进镜像
#                         （/etc/nginx/conf.d/default.conf），监听 8080，
#                         直接托管 /usr/share/nginx/html 下的静态产物。
#   nginx/host-docs.conf  本文件。宿主机上一套独立 nginx 实例的**完整**配置
#                         （含 worker/http 块，由 nginxctl 拉取并启动），
#                         只绑 127.0.0.1:8083，反代到容器。
#
# 两者不能互换：这份带 http{} 外层，塞进 conf.d 会直接 nginx: [emerg]。
#
# 上游是容器 atlantis.BSPDocSystem（宿主机 127.0.0.1:11820 → 容器 8080）。
# 接替原先由 ApiWorker 后端 /docs 前缀提供的文档站（2026-09 迁出）。
#
# 架构位置（本机 nginx 实例中的一套，见 /home/dev/nginx/README.md）：
#
#   云 LB(TLS 终止, *.bsptest.com)
#     → 本机 8080  apiworker 实例（唯一对外端口）
#       → 按 server_name 转发 → 本实例 127.0.0.1:8083
#         → BSPDocSystem 容器(11820)
#
# 为什么要这一跳：对外只有一个端口可用，多个 nginx 进程不可能都绑 8080，
# 所以 apiworker 兼任边缘，本实例只绑 127.0.0.1，不对外可达。
#
# 为什么独立一套实例而不是在边缘直接 proxy_pass：边缘配置的真源在
# senpeng.zheng/ApiWorker 仓库，本项目在 wenqiao.kang/BSPDocSystem。
# 独立实例让文档站的路由改动留在本仓库内，不必跨仓库提 MR。
#
# 部署步骤、边缘侧要提的 MR、开机自启，见本仓 README 的「部署」一节。

worker_processes  auto;
pid                logs/nginx.pid;
error_log          logs/error.log  warn;

events { worker_connections 1024; }

http {
    include       /usr/local/domob/prog.d/nginx-1.24.0/mime.types;
    default_type  application/octet-stream;

    # 普通用户可写目录(相对 -p 前缀)。实例以 dev 运行，写不了 /var/log。
    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    access_log  logs/access.log;
    sendfile    on;
    keepalive_timeout 65;

    # 边缘那层也是 16m，两处需保持一致，否则以更小的为准。
    client_max_body_size 16m;

    # ---- 上游 ----
    upstream docs_site {
        server 127.0.0.1:11820;
        keepalive 32;
    }

    # openapi.json 仍由 API 实时提供，避免 spec 与已部署的 API 版本漂移。
    # 若改为构建期烤进镜像，删掉这个 upstream 和下面对应的 location。
    upstream api_prod {
        server 127.0.0.1:3200;
        keepalive 32;
    }

    # ---- 还原真实客户端 IP ----
    # 请求经 LB → apiworker(8080) → 本实例，$remote_addr 是 127.0.0.1。
    # 信任本机前置转发来的 X-Forwarded-For，取其中最左的真实客户端 IP。
    # 只信 127.0.0.1，不信外部伪造。
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # ---- 公共反代头(TLS 在 LB 终止，scheme 固定 https)----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # 安全头**不在这里加** —— 由边缘的 apiworker 实例统一下发。
    # 两处都加会让响应里出现重复的 X-Frame-Options 等头。
    #
    # ⚠️ 容器那份 nginx/docs.conf 目前自带 X-Frame-Options / X-Content-Type-Options /
    #    Referrer-Policy（为了镜像能独立跑）。边缘也下发同名头时响应里会出现两份。
    #    上线后确认一下：
    #      curl -sI https://docs.bsptest.com/ | grep -ci x-frame-options
    #    结果是 2 就二选一删掉（推荐删边缘那份，留容器的，镜像才自洽）。

    # 只绑 127.0.0.1：本实例不对外，只接受 apiworker 实例的转发。
    server {
        listen 127.0.0.1:8083 default_server;
        server_name docs.bsptest.com;

        # LB 终止 TLS，相对跳转会被拼成 http://host:8083/... （该端口不对外）。
        absolute_redirect off;

        location = /metrics { return 404; }            # Prometheus 指标不外泄

        # 存活/就绪：容器的 nginx/docs.conf 里有对应的 location，返回纯文本 ok。
        # 两条都打到上游，才能真的证明容器在应答（只测本实例没有意义）。
        location = /live  { proxy_pass http://docs_site; access_log off; }
        location = /ready { proxy_pass http://docs_site; access_log off; }

        # ---- llms.txt 约定(llmstxt.org)----
        # 这两个文件必须在**根路径**上：agent 直接猜 <host>/llms.txt，
        # 且文件正文里的自引用地址也写的是根路径。
        #
        # 现在先不开：本仓的 Docusaurus 构建产物里**没有** llms.txt / llms-full.txt
        # （build/ 下只有 404.html assets docs img index.html search
        #   search-index.json sitemap.xml）。开着只会把请求转给容器，拿回一份
        # 404 页面，对 agent 比直接 404 更糟。
        #
        # 两条路，选好再解开对应的一组：
        #   a) 文档站自己生成（推荐，内容跟着本仓走）——加个 Docusaurus 插件或
        #      构建后脚本，把文件产到 build/ 根下，然后用：
        # location = /llms.txt      { proxy_pass http://docs_site; }
        # location = /llms-full.txt { proxy_pass http://docs_site; }
        #
        #   b) 继续由 API 提供：
        # location = /llms.txt      { proxy_pass http://api_prod/docs/llms.txt; }
        # location = /llms-full.txt { proxy_pass http://api_prod/docs/llms-full.txt; }

        # ---- OpenAPI spec：转发给 API，保证跟着部署的 API 版本走 ----
        # 内容始终是匿名视图（平台专属端点已被后端过滤），不需要任何鉴权头。
        # center-console 的 `pnpm api:generate` 读的是 api.bsptest.com/portal/openapi.json，
        # 不是这里，改动本条不影响它。
        location = /openapi.json {
            proxy_pass http://api_prod/docs/openapi.json;
        }

        # ---- 关于旧的 /docs 前缀：这里**不能**做 301 ----
        #
        # 迁移方案原本建议 `location ^~ /docs/ { rewrite ^/docs/(.*)$ /$1 permanent; }`，
        # 前提是"新站在根路径服务，不再有 /docs 前缀"。本仓不是这样：
        # docusaurus.config.js 里 baseUrl='/' 但 routeBasePath='docs'，
        # 也就是 **/docs/** 是正式的线上路由**（/docs/guides/quickstart、
        # /docs/reference/faq …，构建产物 build/docs/ 就是它们），根路径 / 是落地页。
        #
        # 真加了那条 rewrite，等于把整个文档区 301 到一堆不存在的地址，全站 404。
        # 旧地址在新站原地可用，本来也不需要兼容层。
        #
        # 唯一有出入的是旧站的 docs.bsptest.com/docs 首页：新站同一地址是文档首页，
        # 内容不同但不是死链，可以不管。

        location / {
            proxy_pass http://docs_site;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # 兜底：上游若发出到自身 127.0.0.1:11820 的跳转，改写成对外域名。
        # 正常情况下不会触发 —— Host 头是透传的，容器看到的是 docs.bsptest.com；
        # 容器那份 conf 也开了 absolute_redirect off，跳转是相对地址。
        proxy_redirect ~^https?://127\.0\.0\.1:11820/(.*)$ https://docs.bsptest.com/$1;
    }
}
