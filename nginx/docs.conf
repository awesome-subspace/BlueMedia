# BSPDocSystem 的 nginx 配置 —— 全仓唯一一份，由 Dockerfile COPY 进镜像
# （/etc/nginx/conf.d/default.conf）。
#
# ⚠️ 这是 server 块，不是完整 nginx.conf：带 http{} 外层的文件塞进 conf.d 会直接
#    nginx: [emerg]。
#
# 架构位置：
#
#   云 LB(TLS 终止, *.bsptest.com)
#     → 宿主机 8080  ApiWorker 仓的边缘实例（唯一对外端口，按 server_name 分流）
#       → 127.0.0.1:11820  平台把宿主机端口映射到本容器 8080
#         → 本文件
#
# ---- 为什么只剩一份 ----
# 本仓曾经还有 nginx/host-docs.conf：宿主机上另起一套只绑 127.0.0.1:8083 的 nginx
# 实例做中间跳。已删除。那一跳实际只做了「把请求原样转给容器」，而站点自己的路由
# 规则（缓存、真 404、探针、静态托管）本来就该跟着镜像走 —— 拆在两处的代价是改一条
# 路由要同时动镜像和宿主机，且两处会不同步。
#
# 留在边缘（ApiWorker 仓）的只有**域名归属**那一条 server 块，那正是边缘 conf 自己
# 文档写明的职责（「域名归属由本文件决定 —— 新增/摘除域名改这里」）。要粘的片段见
# 本仓 README 的「部署」一节。

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 站点跑在反代后面（LB 终止 TLS → 边缘 8080 → 本容器），
    # 跳转必须是相对地址：绝对地址会带上容器自己的 :8080 和 http:// 协议，
    # 浏览器跟过去就是死路（端口不对外）或明文降级。
    absolute_redirect off;
    port_in_redirect  off;

    # ⚠️ nginx 的 add_header 不累加：只要某个 location 里写了一条 add_header，
    #    server 级的 add_header 就**整组失效**（加 always 也一样）。
    #    所以安全头写在各 location 里，而不是 server 级 —— 写在 server 级的话，
    #    下面每个设缓存头的 location 都会悄悄丢掉安全头。改的时候注意同步。

    # Docusaurus 为每条路由都生成了真实的 index.html，所以这里不是 SPA 回退，
    # 只是把 /docs/xxx 补成 /docs/xxx/index.html。
    #
    # 末尾用 =404 而不是 /404.html：try_files 的最后一个参数若是文件，nginx 会
    # 内部跳转过去并回 **200**，也就是"软 404" —— 客户端和搜索引擎都会把错误页
    # 当成正常页面。走 =404 才会触发下面的 error_page，页面一样，状态码是真的 404。
    location / {
        try_files $uri $uri/ $uri/index.html =404;

        # HTML 不缓存：否则改完文档重新发布，用户还会看到旧页。
        # 注意这条**必须**放在 location / 里，不能用 `location ~* \.html$`：
        # Docusaurus 的线上地址是目录形式（/docs/guides/quickstart），
        # .html 只是 try_files 补出来的内部路径，正则 location 匹配的是请求 URI，
        # 永远匹配不上，等于没写。
        #
        # always 不能省：不带它的 add_header 只作用于 2xx/3xx，404 页会**没有**
        # 这个头，于是错误页反而可能被缓存下来。
        add_header Cache-Control "no-cache, must-revalidate" always;

        # 纯静态文档站，不需要被内嵌到别的站点里
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # 存活/就绪探针。纯静态站没有依赖项要探，两条都只证明 nginx 在应答；
    # 分成两个是为了跟平台健康检查的约定对齐。
    location = /live  { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /ready { access_log off; default_type text/plain; return 200 "ok\n"; }

    # 指标不外泄。本容器没有 exporter，这条是防呆 —— 将来真挂了一个也不会
    # 因为忘了在边缘拦而直接暴露到公网。（原先这条写在已删除的 host-docs.conf 里。）
    location = /metrics { return 404; }

    # 带内容哈希的产物可以长缓存（文件名变了才会重新请求）。
    # 这类响应是图片/JS/CSS，不是可被内嵌的文档，不需要重复安全头。
    #
    # ⚠️ 不要在这里同时写 `expires 1y` —— expires 自己会发一个
    #    `Cache-Control: max-age=31536000`，跟下面的 add_header 叠成**两个**
    #    Cache-Control 响应头。虽然多数客户端取第一个，但这属于协议层面的歧义，
    #    中间层（CDN、公司代理）行为不一致。只留 add_header，一条头写全。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 同理，不叠 expires。图片文件名不带哈希，所以只给 30d 而不是 immutable。
    location /img/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 站内搜索索引每次构建都会变（前端带 ?_=<hash> 请求，精确匹配不受查询串影响）
    location = /search-index.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # /404.html 会重新走一遍 location 匹配，落回上面的 location /，
    # 因此错误页同样带上安全头和 no-cache。
    error_page 404 /404.html;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    access_log /var/log/nginx/docs.access.log;
    error_log  /var/log/nginx/docs.error.log warn;
}
