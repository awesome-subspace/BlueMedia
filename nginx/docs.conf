# BSPDocSystem 站点的 nginx server 块（打进镜像，非宿主机那套 conf）。
#
# 监听 8080：容器内不需要特权端口，平台侧把宿主机端口映射到它即可（生产 11820）。
#
# 宿主机那套反代实例的配置在同目录 nginx/host-docs.conf，两份别搞混：
# 那份是完整 nginx.conf（含 http{}），塞进 conf.d 会 [emerg]；这份是纯 server 块。

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 站点跑在反代后面（LB 终止 TLS → apiworker:8080 → host:8083 → 本容器），
    # 跳转必须是相对地址：绝对地址会带上容器自己的 :8080 和 http:// 协议，
    # 浏览器跟过去就是死路（端口不对外）或明文降级。
    absolute_redirect off;
    port_in_redirect  off;

    # ⚠️ nginx 的 add_header 不累加：只要某个 location 里写了一条 add_header，
    #    server 级的 add_header 就**整组失效**（加 always 也一样）。
    #    所以安全头写在各 location 里，而不是 server 级 —— 写在 server 级的话，
    #    下面每个设缓存头的 location 都会悄悄丢掉安全头。改的时候注意同步。

    # Docusaurus 为每条路由都生成了真实的 index.html，所以这里不是 SPA 回退，
    # 只是把 /docs/xxx 补成 /docs/xxx/index.html。
    #
    # 末尾用 =404 而不是 /404.html：try_files 的最后一个参数若是文件，nginx 会
    # 内部跳转过去并回 **200**，也就是"软 404" —— 客户端和搜索引擎都会把错误页
    # 当成正常页面。走 =404 才会触发下面的 error_page，页面一样，状态码是真的 404。
    location / {
        try_files $uri $uri/ $uri/index.html =404;

        # HTML 不缓存：否则改完文档重新发布，用户还会看到旧页。
        # 注意这条**必须**放在 location / 里，不能用 `location ~* \.html$`：
        # Docusaurus 的线上地址是目录形式（/docs/guides/quickstart），
        # .html 只是 try_files 补出来的内部路径，正则 location 匹配的是请求 URI，
        # 永远匹配不上，等于没写。
        add_header Cache-Control "no-cache, must-revalidate";

        # 纯静态文档站，不需要被内嵌到别的站点里
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # 存活/就绪探针。纯静态站没有依赖项要探，两条都只证明 nginx 在应答；
    # 分成两个是为了跟宿主机实例和平台健康检查的约定对齐（见 host-docs.conf）。
    location = /live  { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /ready { access_log off; default_type text/plain; return 200 "ok\n"; }

    # 带内容哈希的产物可以长缓存（文件名变了才会重新请求）。
    # 这类响应是图片/JS/CSS，不是可被内嵌的文档，不需要重复安全头。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 站内搜索索引每次构建都会变（前端带 ?_=<hash> 请求，精确匹配不受查询串影响）
    location = /search-index.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # /404.html 会重新走一遍 location 匹配，落回上面的 location /，
    # 因此错误页同样带上安全头和 no-cache。
    error_page 404 /404.html;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    access_log /var/log/nginx/docs.access.log;
    error_log  /var/log/nginx/docs.error.log warn;
}
